# The agent registry, as data.
#
# Standing constraint from the brief: "If you type four agent names into source
# code, you have made a mistake."
#
# Discovery is LIVE. GET /api/tasks on the harness serves the `tasks` catalog
# (task_id, label, owner), seeded from src/lib/pipeline/registry.ts. That is the
# upstream's own enumeration of its agents, so the registry reads it at boot and
# on a schedule rather than trusting this file.
#
# What /api/tasks does NOT carry: version, capabilities, role. Those are
# enriched from the `agents` block below, matched on id. So this file is an
# overlay, not the source of truth — if Chauncey adds a fifth agent it appears
# in the dashboard on the next refresh without anyone editing anything.

discovery:
  enabled: true
  url: "http://34.203.238.63:3000/api/tasks"
  # Response shape: {"tasks":[{task_id,label,owner,created_at}]}
  collection_key: tasks
  id_key: task_id
  name_key: label
  refresh_seconds: 900

upstreams:
  agentic-harness:
    base_url: "http://34.203.238.63:3000"
    # Phase 0: no authentication on any route. Populated when that changes.
    auth: null
    runs_path: "/api/runs"
    run_path: "/api/runs/{run_id}"

agents:
  - id: intake
    name: "Intake"
    role: ally
    version: "0.1.0-stub"
    source: agentic-harness
    invoke_path: "/api/agents/intake"
    upstream_task_id: intake
    capabilities: [parse_brief, search_knowledge_base]
    owner: "Dev 1"
    active: true

  - id: review
    name: "Review / Triage"
    role: trickster
    version: "0.1.0-stub"
    source: agentic-harness
    invoke_path: "/api/agents/review"
    upstream_task_id: review
    capabilities: [map_rejection_reason, wf_comments_create]
    owner: "Dev 2"
    active: true

  - id: audience_creation
    name: "Audience Creation"
    role: ally
    version: "0.1.0-stub"
    source: agentic-harness
    invoke_path: "/api/agents/audience-creation"
    upstream_task_id: audience_creation
    capabilities: [build_path_decision, attribute_availability, segment_estimate]
    owner: "Chauncey"
    active: true

  - id: escalation
    name: "Escalation"
    role: trickster
    version: "0.1.0-stub"
    source: agentic-harness
    invoke_path: "/api/agents/escalation"
    upstream_task_id: escalation
    capabilities: [classify_failure]
    owner: "Unassigned"
    active: true

  - id: mentor
    name: "Mentor Agent"
    role: mentor
    version: "0.1.0"
    source: agent-manager
    invoke_path: null
    upstream_task_id: null
    capabilities: [propose_knowledge_node]
    owner: "Agent Manager"
    active: true
