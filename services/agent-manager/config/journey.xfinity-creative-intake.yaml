# A Journey is a PROCESS DEFINITION, expressed as data.
#
# This file is the whole reason Agent Manager is reusable: to onboard a new
# process, you write one of these and restart. No Python changes, no migration,
# no hardcoded agent names, no hardcoded stage list.
#
# Structure follows TAP CXM's Agentic Hero's Journey (Josh Smith):
#   acts    -> Prologue, Separation, Initiation, Return
#   stages  -> the digital artifacts (Josh: "the stages in each act are the
#              digital artifacts"). Each stage names the artifact it produces,
#              which agent role plays it, and which human role authors/approves it.
#
# Roles, per the master presentation:
#   hero      = THE DATA. Not a person and not an agent. What accumulates.
#   author    = the humans, collectively. They edit and approve the artifacts.
#   mentor    = agent that carries what previous runs learned and hands it over
#   ally      = agent that extends what the hero can do (prep, enrichment)
#   trickster = agent that introduces friction deliberately (adversarial checks)
#
# approver_role is one of the seven human mentor roles from the deck:
#   visionary governor steward driver informer gate_keeper facilitator

key: xfinity-creative-intake
name: Xfinity Creative Intake
client: Comcast
version: "1"

# How a run of this journey reaches its upstream executor.
executor:
  adapter: agentic-harness
  # The upstream's own vocabulary, mapped once, here — not in code.
  status_map:
    completed: completed
    needs_input: needs_input
    failed: failed
    running: running

acts:
  - key: prologue
    title: "Prologue · Setting the Stage"
    intent: "The world the agents enter is made visible before any agent acts."
    stages:
      - key: brief
        title: "The Dream"
        artifact: "The marketer's raw brief"
        agent_role: none
        approver_role: facilitator
        gate: false
        description: >
          Event 0. Captured verbatim, never edited. Everything downstream is
          judged against this.

  - key: separation
    title: "Act 1 · Separation"
    intent: "First agents enter a still-manual system. Can the data answer the question?"
    stages:
      - key: intake
        title: "Call to Adventure"
        artifact: "Structured intake — audience intent, XDM fields, FAC-vs-native flag"
        agent_role: ally
        agent_id: intake
        approver_role: steward
        gate: false
        health:
          # B1: "more than two rounds means the agent failed, not the marketer."
          metric: loop_count
          warn_above: 2

      - key: grounding
        title: "Supernatural Aid"
        artifact: "Knowledge-base grounding hits"
        agent_role: mentor
        agent_id: intake
        approver_role: steward
        gate: false
        description: >
          The gift the mentor hands the hero. Currently failing upstream —
          search_knowledge_base returns "Unknown tool" and the step still
          reports completed. Reconciliation catches this; the stage badge
          must not read green because a status field says so.

  - key: initiation
    title: "Act 2 · Initiation"
    intent: "Agents coordinate. Cohesion is the real work."
    stages:
      - key: review
        title: "Road of Trials"
        artifact: "Triage verdict — which field is at fault, and the redraft"
        agent_role: trickster
        agent_id: review
        approver_role: gate_keeper
        gate: false

      - key: audience_creation
        title: "Meeting with the Mentor"
        artifact: "Build-path decision, predicted count, identity-gap check"
        agent_role: ally
        agent_id: audience_creation
        approver_role: governor
        gate: false

      - key: workfront_request
        title: "Crossing the Threshold"
        artifact: "The Workfront request"
        agent_role: none
        approver_role: gate_keeper
        gate: true
        reconcile: true
        description: >
          The only stage that writes to a system of record. A human confirms
          before it executes, and the reconciler reads it back afterwards.

      - key: escalation
        title: "Belly of the Whale"
        artifact: "Failure classification"
        agent_role: trickster
        agent_id: escalation
        approver_role: informer
        gate: false
        optional: true

  - key: return
    title: "Act 3 · Return"
    intent: >
      Return with new mastery. The recursive learning loop — this act is the
      product, not a reporting afterthought.
    stages:
      - key: proposal
        title: "The Road Back"
        artifact: "Knowledge node proposed by the Mentor Agent"
        agent_role: mentor
        agent_id: mentor
        approver_role: gate_keeper
        gate: true
        description: >
          The Mentor Agent proposes. It has no code path that approves.

      - key: promotion
        title: "Return with New Mastery"
        artifact: "Promoted node in the shared knowledge graph"
        agent_role: none
        approver_role: gate_keeper
        gate: true
        human_only: true
        description: >
          A named human promotes. This is the elixir. A run that submits a
          request but promotes nothing has not finished Act 3.
