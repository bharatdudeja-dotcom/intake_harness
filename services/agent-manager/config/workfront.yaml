# Workfront object model — CONFIRMED, not a draft guess.
#
# Chauncey's caveat on the agents' wf_core_* tools was: "a draft guess, not
# confirmed against Comcast's real Workfront object model." The forms list
# shared on 15 Sep 2026 gives the real shape, so these are observed object
# codes and form IDs, not invented ones.
#
# Object codes are Workfront's own: OPTASK = Issue/Request, PROJ = Project,
# DOCU = Document.

connector:
  # D9: the in-house MCP estate (chaunceyplum/mcp), not Adobe's official
  # connector. Fifteen Lambdas behind one API Gateway; those Lambdas own auth
  # (Workfront IMS, Adobe IMS, SSM-resolved credentials), so nothing here
  # carries a token.
  #
  # Paste the McpEndpointUrl SAM output, or set AM_MCP_ENDPOINT_URL, which wins.
  # A trailing /mcp is stripped; routes are chosen from the tool-name prefix.
  endpoint_url: ""
  instance: "taplondonptrsd.my.workfront.com"
  transport: json_rpc_http

  # Tool families generated by make_crud_tools upstream: every object gets
  # _list, _get, _create, _update, _delete and _set_custom_fields.
  object_tools:
    OPTASK: wf_core_issue
    PROJ: wf_core_project
    TASK: wf_core_task

forms:
  - name: "CSC Intake - Issue"
    attaches_to: OPTASK
    id: "69cad7690002898fbf9d684642dc25bc"
    role: intake_request          # what a new intake creates
  - name: "Product Ingredients Control Project Form"
    attaches_to: OPTASK
    id: "6a754b850002f6d4dd06be46f380e1d3"
  - name: "Campaign Brief"
    attaches_to: PROJ
    id: "6a7fe8cd00009db10945006d6f98f6f1"
    role: campaign_brief          # the artifact in config/artifact.campaign-brief.yaml
  - name: "Campaign Brief: Multi-stage CRM"
    attaches_to: PROJ
    id: "6735d7ed00309e51d138d3910f3f0ddc"
  - name: "CSC Campaign - Project"
    attaches_to: PROJ
    id: "69cad8b50003003989ed1bb9a30eb40a"
    role: campaign_project
  - name: "Email Details"
    attaches_to: PROJ
    id: "67487f2c002442bd9740ebccef875143"
  - name: "Banking Request Form"
    attaches_to: PROJ
    id: "6a6651780000fa28e6f17b8caecfea48"
  - name: "External Look Up"
    attaches_to: PROJ
    id: "6a75497e00023bac84d41c36aa0cdf94"
  - name: "Testing_Copy_environment"
    attaches_to: PROJ
    id: "6a73e970000293b2a8fb37cd09239535"
  - name: "LVMH - Centric data"
    attaches_to: PROJ
    id: "64c7dce20016d708232e4635f7ab0e87"
  - name: "CSC Asset - Document"
    attaches_to: DOCU
    id: "69cad9bf00034a71eabef0f88aaaa2ec"
    role: asset
  - name: "Marketing text"
    attaches_to: DOCU
    id: "64ccca42000837565c687bfdc33be55f"

# Which fields of an object we read back to reconcile a write. Every Workfront
# write records `asserted`, is re-read through the official connector, records
# `observed`, and produces match | drift | missing.
reconcile_fields:
  OPTASK: [ID, name, status, priority, plannedCompletionDate, description]
  PROJ: [ID, name, status, plannedStartDate, plannedCompletionDate]
  DOCU: [ID, name]
