<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Manager{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
  :root{
    --navy:#14135E; --navy-2:#1E1C7A; --ink:#111827; --muted:#6B7280;
    --line:#E5E7EB; --bg:#F7F8FB; --card:#fff;
    --green:#16A34A; --amber:#B45309; --red:#A33A2B; --teal:#0E6E6E;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  a{color:var(--navy)}
  header{background:var(--navy);color:#fff;padding:0 24px}
  header .bar{display:flex;align-items:center;gap:28px;max-width:1240px;margin:0 auto;height:56px}
  header .brand{font-weight:700;letter-spacing:.2px}
  header .brand small{display:block;font-weight:400;font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
  header nav{display:flex;gap:20px;margin-left:auto}
  header nav a{color:#fff;opacity:.78;text-decoration:none;font-size:14px}
  header nav a:hover,header nav a.on{opacity:1;border-bottom:2px solid #6EE7B7;padding-bottom:2px}
  .wrap{max-width:1240px;margin:26px auto 60px;padding:0 24px}
  h1{font-size:23px;margin:0 0 4px}
  h2{font-size:16px;margin:28px 0 10px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     padding:10px 14px;background:#FAFBFD;border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid #F1F2F6;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
        border:1px solid transparent;white-space:nowrap}
  .pill.done{background:#ECFDF3;color:#15803D;border-color:#BBF7D0}
  .pill.pending{background:#F3F4F6;color:#6B7280;border-color:#E5E7EB}
  .pill.waiting{background:#FFF7ED;color:#B45309;border-color:#FED7AA}
  .pill.faulted{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
  .pill.drift{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
  .pill.role{background:#EEF2FF;color:#3730A3;border-color:#C7D2FE}
  .pill.human{background:#F0FDFA;color:#0F766E;border-color:#99F6E4}
  .flag{color:var(--red);font-size:13px}
  .muted{color:var(--muted)}
  .mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
  .act{flex:1 1 210px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .act h3{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
  .act p{margin:0 0 10px;font-size:12px;color:var(--muted)}
  .stage{display:flex;justify-content:space-between;gap:8px;align-items:center;
         padding:5px 0;border-top:1px solid #F3F4F6;font-size:13px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
  .filters label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block}
  select,input[type=text],textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
  button{padding:8px 14px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);
         color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:#fff;color:var(--navy)}
  button.danger{background:#fff;color:var(--red);border-color:#F3C7C0}
  pre{background:#0F172A;color:#E2E8F0;padding:12px;border-radius:8px;overflow:auto;font-size:12px;margin:8px 0 0}
  .timeline{border-left:2px solid var(--line);margin-left:10px;padding-left:18px}
  .ev{position:relative;padding:12px 0;border-bottom:1px solid #F1F2F6}
  .ev:before{content:"";position:absolute;left:-25px;top:18px;width:10px;height:10px;border-radius:50%;
             background:#fff;border:2px solid var(--navy)}
  .ev.human:before{border-color:var(--teal)}
  .ev.superseded{opacity:.55}
  .ev h4{margin:0 0 2px;font-size:14px}
  .banner{border-left:4px solid var(--red);background:#FEF2F2;padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:16px}
  .banner.ok{border-color:var(--green);background:#ECFDF3}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:4px 14px;font-size:13.5px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Agent Manager<small>{{ journey.name }}{% if journey.client %} · {{ journey.client }}{% endif %}</small></div>
    <nav>
      <a href="/" class="{{ 'on' if nav=='queue' }}">Queue</a>
      <a href="/programme" class="{{ 'on' if nav=='programme' }}">Programme</a>
      <a href="/knowledge" class="{{ 'on' if nav=='knowledge' }}">Knowledge</a>
    </nav>
  </div>
</header>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
