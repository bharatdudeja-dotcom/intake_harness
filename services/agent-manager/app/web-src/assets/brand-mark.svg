<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agent Manager">
  <!--
    PLACEHOLDER BRAND MARK.

    Drop the real Comcast asset in as assets/brand-mark.svg (or .png and change
    the two <link>/<img> references) and everything picks it up: browser tab,
    sidebar, and the PDF export.

    This is deliberately NOT an imitation of the Comcast logo. Using a
    made-up version of a client's mark in something a client will see is worse
    than using none - it looks like the real thing until someone notices it is
    not. So this is a neutral stand-in until the licensed file is dropped in.
  -->
  <rect width="64" height="64" rx="15" fill="#14135E"/>
  <circle cx="32" cy="24.5" r="6.5" fill="#fff"/>
  <path d="M15 47c0-9.4 7.6-17 17-17s17 7.6 17 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
